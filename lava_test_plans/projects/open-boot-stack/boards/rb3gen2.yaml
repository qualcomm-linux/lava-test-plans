# Qualcomm RB3 Gen 2 (QCS6490): what the open boot stack hands to Linux and
# what the tests expect of it. Pass with --variables after variables.yaml.
OBS_CPUS: "8"
OBS_BOOT_CPU: "0x0"
OBS_EXCEPTION_LEVEL: "EL2"
OBS_KVM: "vhe"
OBS_TEE: "optee"
OBS_PSCI_MODE: "osi"
OBS_REMOTEPROCS: "adsp cdsp"
OBS_REMOTEPROC_RESTART_XFAIL: "adsp=the Linux audio drivers do not survive an ADSP stop"
OBS_FASTRPC_TESTS: "adsp:adsp:0:0 cdsp:cdsp:3:0 cdsp-unsigned-pd:cdsp:3:1"
OBS_FASTRPC_NODES: ""
# No audio userspace in the image.
OBS_AUDIO: {}
OBS_GPU_TEST_CMD: "egl-readback"
OBS_VIDEO:
  DEVICE: "aa00000.video-codec"
  DRIVER: "qcom-iris"
  FIRMWARE: "/lib/firmware/qcom/vpu/vpu20_p1.mbn"
  DECODERS: "h264 hevc vp9"
  ENCODERS: "h264 hevc"
# The Cortex-A78 cores share one PMU type.
OBS_KVM_CPUS: "4-7"
OBS_CPU_FEATURES_EXPECTED: "FEAT_AA32EL0 FEAT_AA64EL2 FEAT_AA64EL3 FEAT_FP16 FEAT_GICv3 FEAT_RAS FEAT_CSV2 FEAT_CSV3 FEAT_SSBS FEAT_Debugv8p2 FEAT_PMUv3 FEAT_PMUv3p1 FEAT_AES FEAT_PMULL FEAT_SHA1 FEAT_SHA256 FEAT_CRC32 FEAT_LSE FEAT_RDM FEAT_DotProd FEAT_DPB FEAT_LRCPC FEAT_TGran16 FEAT_TGran64 FEAT_TGran4 FEAT_MixedEnd FEAT_HAFDBS FEAT_VMID16 FEAT_VHE FEAT_HPDS FEAT_HPDS2 FEAT_LOR FEAT_PAN FEAT_PAN2 FEAT_XNX FEAT_TTCNP FEAT_UAO FEAT_IESB"
# inference: the processing units and runtimes (PUS) and the units the
# board lacks, with the reason (ABSENT).
OBS_INFERENCE_PUS: "cpu:qnn npu0:qnn-htp:v68:0:cdsp cpu:tflite gpu:tflite-gpu"
OBS_INFERENCE_ABSENT: ""
