name: Submit test jobs

# Once render-jobs.yml has passed on the default branch and tagged it with a
# new qcom-linux-testkit release, render the test plans against real builds
# with that testkit tag and submit the jobs to LAVA:
#
# - meta-qcom: the latest nightly build of master
# - qcom-deb-images: for every kernel flavour, the latest nightly build of the
#   workflow that builds it
#
# The builds, their test plans and the machines to run them on are listed in
# .github/lava-submit.yml. .github/scripts/lava-submit-plan.py finds the run
# of every build and works out the build URL and the variables to render with;
# submit-testplan.yml is called once per project, test plan and build to
# render the jobs with the lava-test-plans action and submit each with
# foundriesio/lava-action.
#
# Tags created with GITHUB_TOKEN, as render-jobs.yml does, start no workflow,
# so this one follows the render-jobs.yml run instead and goes on only when
# that run added the tag. Every LAVA job is waited for, and a failed test or
# an incomplete job fails its GitHub job, so that a testkit release that
# breaks a test is caught before projects move to it. The results are kept
# as JUnit artifacts of the run.
#
# Needs the LAVATOKEN secret, a token of a LAVA user allowed to submit jobs.

on:
  workflow_run:
    workflows: [Render test jobs]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      testkit_ref:
        description: >
          Revision of qcom-linux-testkit to render with. Defaults to the
          testkit_ref default of action.yml.
        type: string
        required: false
        default: ""
      projects:
        description: >
          Comma separated projects to submit jobs for. Empty means every
          project in .github/lava-submit.yml.
        type: string
        required: false
        default: ""
      submit:
        description: Submit the rendered jobs to LAVA; when off, only render them
        type: boolean
        required: false
        default: true

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Find testkit release
    # a render-jobs.yml run of a push to master that passed; it only tags on
    # such a run, and only once every test plan rendered
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh api reading action.yml and the tag
    outputs:
      testkit_ref: ${{ steps.release.outputs.testkit_ref }}
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - name: Find testkit release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_TESTKIT_REF: ${{ inputs.testkit_ref }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          TAG="${INPUTS_TESTKIT_REF}"
          if [ -z "${TAG}" ]; then
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/contents/action.yml?ref=${HEAD_SHA}" --jq .content \
              | base64 -d | yq -r '.inputs.testkit_ref.default')
          fi

          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            # go on only when the render-jobs.yml run tagged its commit: the
            # tag exists, points at it and was made after the run started, so
            # a re-run of an already tagged commit submits nothing again
            if ! REF_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null); then
              echo "${RUN_URL} added no tag (${TAG} does not exist), nothing to submit"
              exit 0
            fi
            if [ "$(jq -r .object.type <<< "${REF_JSON}")" != "tag" ]; then
              echo "${TAG} is not an annotated tag, render-jobs.yml did not add it, nothing to submit"
              exit 0
            fi
            TAG_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<< "${REF_JSON}")")
            TARGET=$(jq -r .object.sha <<< "${TAG_JSON}")
            TAGGED_AT=$(jq -r .tagger.date <<< "${TAG_JSON}")
            if [ "${TARGET}" != "${HEAD_SHA}" ]; then
              echo "${TAG} tags ${TARGET}, not ${HEAD_SHA}, nothing to submit"
              exit 0
            fi
            # both are UTC timestamps in the same format, so they sort as text
            if [[ "${TAGGED_AT}" < "${RUN_STARTED_AT}" ]]; then
              echo "${TAG} was added at ${TAGGED_AT}, before ${RUN_URL} started, nothing to submit"
              exit 0
            fi
          fi

          echo "Submitting test jobs of lava-test-plans ${HEAD_SHA} with qcom-linux-testkit ${TAG}"
          echo "testkit_ref=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "ref=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  plan:
    name: Find builds
    needs: release
    if: ${{ needs.release.outputs.testkit_ref != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.ref }}
          persist-credentials: false

      - name: Find builds
        id: plan
        env:
          # the builds are in other public repositories, read through the API
          GH_TOKEN: ${{ github.token }}
          TESTKIT_REF: ${{ needs.release.outputs.testkit_ref }}
          REF: ${{ needs.release.outputs.ref }}
          PROJECTS: ${{ inputs.projects }}
        run: |
          set -euo pipefail
          pip install pyyaml
          MATRIX=$(python3 .github/scripts/lava-submit-plan.py \
            --testkit-ref "${TESTKIT_REF}" \
            --lava-test-plans-ref "${REF}" \
            --projects "${PROJECTS}")
          echo "${MATRIX}" | jq .
          if [ "$(echo "${MATRIX}" | jq '.include | length')" -eq 0 ]; then
            echo "::error::found no build to submit test jobs for"
            exit 1
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
          echo "groups=$(echo "${MATRIX}" | jq -c '[.include[].group] | unique')" >> "${GITHUB_OUTPUT}"

  submit:
    name: ${{ matrix.name }}
    needs: [release, plan]
    permissions:
      contents: read # actions/checkout, actions/download-artifact
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: $/.github/workflows/submit-testplan.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      ref: ${{ needs.release.outputs.ref }}
      testkit_ref: ${{ needs.release.outputs.testkit_ref }}
      name: ${{ matrix.name }}
      group: ${{ matrix.group }}
      project: ${{ matrix.project }}
      testplan: ${{ matrix.testplan }}
      machines: ${{ matrix.machines }}
      distro_name: ${{ matrix.distro_name }}
      build_url: ${{ matrix.build_url }}
      os_info: ${{ matrix.os_info }}
      variables: ${{ matrix.variables }}
      submit: ${{ github.event_name != 'workflow_dispatch' || inputs.submit }}

  results:
    name: Results ${{ matrix.group }}
    needs: [release, plan, submit]
    # also when some LAVA jobs failed, which is when the summary matters most
    if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.submit) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # the action downloading the job details of this run
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
    steps:
      - name: Summarise results
        id: summary
        uses: qualcomm/qcom-reusable-workflows/.github/actions/test-job-summary@4b30d9b1b808728323f3b9fd67f4c1c6f2294757 # v2.0.17
        with:
          build_id: ${{ github.run_id }}
          gh_token: ${{ github.token }}
          # the job details lava-action saved for the group, see
          # submit-testplan.yml
          prefix: ${{ matrix.group }}_test-job-*
          summary_file_name: ${{ matrix.group }}-test_job_summary
          summary_title: ${{ matrix.group }} (${{ needs.release.outputs.testkit_ref }})

      - name: Publish results
        env:
          SUMMARY_FILE: ${{ matrix.group }}-test_job_summary
        run: cat "${SUMMARY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
