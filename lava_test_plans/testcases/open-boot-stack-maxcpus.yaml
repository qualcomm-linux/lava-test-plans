{% extends "testcases/templates/master.jinja2" %}

{# Boot an image whose kernel command line has maxcpus=MAXCPUS: the     #}
{# firmware fingerprints, exactly MAXCPUS CPUs at boot, then every other #}
{# CPU brought up through PSCI CPU_ON, cpufreq and the PSCI mode with all #}
{# CPUs online. Board facts: projects/open-boot-stack/boards/.          #}
{% set test_name = "open-boot-stack-maxcpus" %}
{% set tests_timeout = 15 %}
{% set test_timeout = tests_timeout + 3 %}
{% import "testcases/templates/definitions.jinja2" as defs with context %}
{% import "projects/open-boot-stack/include/common.jinja2" as c with context %}
{% set td = c.td %}
{% set maxcpus = MAXCPUS|default("1")|string %}

{% set tests = [
    c.boot_fingerprint,
    {"name": "boot-handoff", "path": td ~ "boot-handoff/boot-handoff.yaml",
     "params": dict(c.boot_handoff_params, CPUS=maxcpus)},
    {"name": "maxcpus", "path": td ~ "maxcpus/maxcpus.yaml", "params": {"MAXCPUS": maxcpus}},
    {"name": "cpufreq-policy", "path": td ~ "cpufreq-policy/cpufreq-policy.yaml",
     "params": {"ONLINE_ALL": "true", "STRESS_SECONDS": "60"}},
    c.kernel_health,
] %}

{% block test_target %}
- test:
    timeout:
      minutes: {{ tests_timeout }}
    definitions:
{{ defs.definitions(tests, TEST_DEFINITIONS_REPOSITORY, EXCLUDED_TESTS|default([])) }}
{{ c.poweroff }}
{% endblock test_target %}
